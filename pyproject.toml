[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nnunet"
version = "0.1.0"
description = "nnUNet medical image segmentation project"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "monai",
    "hydra-core",
    "stable-pretraining",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nnunet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
